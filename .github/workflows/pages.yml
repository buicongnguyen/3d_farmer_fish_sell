name: Build, test and publish Willowmere
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      gate: ${{ steps.gate.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Keep the chunks of the last week's deploys, so pages loaded before this release still find them.
      - run: node scripts/keep-chunks.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # The same build, for the browser gate below.
      - id: gate
        run: echo "suites=$(node scripts/browser-suites.mjs gate --list)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
  # The deploy gate: the "gate" list of tests/browser-suites.json, one job per suite as in browser-tests.yml (software
  # WebGL). Only suites that are short and steady there belong in that list; the rest run nightly and block nothing.
  # A red job here stops the publish: read its log, and re-run the job once if it failed on time alone.
  browser-gate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.build.outputs.gate) }}
    env:
      CI: '1'
      GAME_URL: http://127.0.0.1:4418
      EVIDENCE: test-results/evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Serve the build
        run: |
          node scripts/serve-dist.mjs dist 4418 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:4418/ && break; sleep 1; done
      - name: Run ${{ matrix.suite }}
        run: node tests/${{ matrix.suite }}.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.suite }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
  deploy:
    needs: [build, browser-gate]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the game
        id: deployment
        uses: actions/deploy-pages@v4
